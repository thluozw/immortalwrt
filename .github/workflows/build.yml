name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target"
        required: true
        default: "qualcommax/ipq60xx"
      device:
        description: "Device"
        required: true
        default: "jdcloud_re-cs-02"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build.yml"
      - "configs/config_jdcloud_re-cs-02.config"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            git libncurses-dev libssl-dev python3 subversion unzip wget gettext zstd \
            libelf-dev libtool rsync bc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download pre-configured .config
        run: |
          curl -L -o .config \
            https://raw.githubusercontent.com/thluozw/immortalwrt/master/configs/config_jdcloud_re-cs-02.config
          echo "=== Config check ==="
          grep -E "^CONFIG_TARGET_PROFILE|CONFIG_TARGET_qualcommax_ipq60xx_DEVICE|CONFIG_DEFAULT_ipq-wifi|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_docker|CONFIG_PACKAGE_mwan3" .config | head -15

      - name: Bootstrap feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build
        run: make -j$(nproc) world
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
            bin/targets/qualcommax/ipq60xx/*initramfs*.itb
            bin/targets/qualcommax/ipq60xx/sha256sums
          retention-days: 3
