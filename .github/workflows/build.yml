name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target (e.g. qualcommax/ipq60xx)"
        required: true
        default: "qualcommax/ipq60xx"
      device:
        description: "Device (e.g. jdcloud_re-cs-02)"
        required: true
        default: "jdcloud_re-cs-02"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gcc-multilib gawk \
            git libncurses-dev libssl-dev python3 subversion unzip wget libelf-dev zstd \
            ccache gettext rsync
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/
            Makefile
            include/
            target/
            tools/
            package/
            feeds.conf.default
            config
            rules.mk
          sparse-checkout-cone-mode: false
      - name: Bootstrap feeds
        run: |
          cat > feeds.conf.default << EOF
src-link base ../feeds/base
src-link packages ../feeds/packages
src-link luci ../feeds/luci
src-link routing ../feeds/routing
src-link telephony ../feeds/telephony
EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure target and device
        run: |
          TARGET="${{ inputs.target }}"
          DEVICE="${{ inputs.device }}"
          BOARD=$(echo "$TARGET" | cut -d/ -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d/ -f2)
          echo "Board: $BOARD  Subtarget: $SUBTARGET  Device: $DEVICE"

          make defconfig BOARD="$BOARD" SUBTARGET="$SUBTARGET"

          echo "CONFIG_TARGET_${BOARD^^}_${SUBTARGET^^}=y" >> .config
          echo "CONFIG_TARGET_${BOARD^^}_${SUBTARGET^^}_DEVICE_${DEVICE//-/_}=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_OVERLAY=y" >> .config

          echo "=== Config lines ===" 
          grep -E "qualcommax|jdc|ROOTFS" .config | head -10
      - name: Build
        run: make -j$(nproc) world
        env:
          MAKEFLAGS: "-j$(nproc)"
          DEBIAN_FRONTEND: "noninteractive"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: |
            bin/targets/${{ inputs.target }}/*sysupgrade.bin
            bin/targets/${{ inputs.target }}/*initramfs.uImage.itb
            bin/targets/${{ inputs.target }}/*md5sum
          retention-days: 3