name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target"
        required: true
        default: "qualcommax/ipq60xx"
      device:
        description: "Device"
        required: true
        default: "jdcloud_re-cs-02"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build.yml"
      - "files/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            git libncurses-dev libssl-dev python3 subversion unzip wget gettext zstd \
            libelf-dev libtool rsync bc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          TARGET="${{ github.event.inputs.target || 'qualcommax/ipq60xx' }}"
          DEVICE="${{ github.event.inputs.device || 'jdcloud_re-cs-02' }}"
          BOARD=$(echo "$TARGET" | cut -d/ -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d/ -f2)

          make defconfig BOARD="$BOARD" SUBTARGET="$SUBTARGET"

          # Disable ALL other target platforms (only build qualcommax/ipq60xx)
          for t in bcm53xx bcm4908 gemini hi3516av hi3519av imx mediatek mvebu octeon oxnas qemu ramips realtek rockchip sunxi x86; do
            sed -i "s/^CONFIG_TARGET_${t}=y$/# CONFIG_TARGET_${t} is not set/" .config
            sed -i "s/^CONFIG_TARGET_${t}_/# CONFIG_TARGET_${t}_ is not set #/" .config
          done

          # Set the correct device
          sed -i "s|^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=.*|CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y|" .config
          sed -i '/CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02.*is not set/d' .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_jdcloud_re-cs-02\"" >> .config
          echo "CONFIG_TARGET_ROOTFS_OVERLAY=y" >> .config

          # Fix ipq-wifi: use jdcloud wifi driver instead of 8devices
          sed -i 's|CONFIG_DEFAULT_ipq-wifi-8devices_mango=y|# CONFIG_DEFAULT_ipq-wifi-8devices_mango is not set|' .config
          echo "CONFIG_DEFAULT_ipq-wifi-jdcloud_re-cs-02=y" >> .config
          sed -i 's|CONFIG_PACKAGE_ipq-wifi-8devices_mango=y|# CONFIG_PACKAGE_ipq-wifi-8devices_mango is not set|' .config
          echo "CONFIG_PACKAGE_ipq-wifi-jdcloud_re-cs-02=y" >> .config

          # === Default packages (from jdcloud_re-cs-02 + base) ===
          for pkg in \
            ath11k-firmware-qcn9074 \
            ipq-wifi-jdcloud_re-cs-02 \
            kmod-ath11k-pci \
            ath11k-firmware-ipq6018 \
            automount \
            base-files \
            ca-bundle \
            dnsmasq-full \
            dropbear \
            firewall4 \
            fstools \
            kmod-ath11k-ahb \
            kmod-gpio-button-hotplug \
            kmod-leds-gpio \
            kmod-nft-offload \
            kmod-qca-nss-dp \
            kmod-usb-dwc3 \
            kmod-usb-dwc3-qcom \
            kmod-usb3 \
            libc \
            libgcc \
            libustream-openssl \
            logd \
            losetup \
            mtd \
            netifd \
            nftables \
            odhcp6c \
            odhcpd-ipv6only \
            ppp \
            ppp-mod-pppoe \
            procd-ujail \
            uboot-envtools \
            uci \
            uclient-fetch \
            urandom-seed \
            urngd \
            wpad-openssl; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          # === LuCI packages ===
          for pkg in luci luci-ssl-openssl luci-app-firewall luci-app-mwan3 luci-i18n-mwan3-zh-cn luci-i18n-base-zh-cn luci-theme-bootstrap; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          # === Docker & container (for dockerman) ===
          for pkg in dockerd luci-app-dockerman kmod-veth kmod-nf-ipvs kmod-ipt-nat kmod-ipt-extra kmod-ipt-nat6 kmod-ipt-physdev kmod-fs-btrfs; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          # === Network (mwan3 deps) ===
          for pkg in ip-full iptables kmod-ipt-conntrack-extra kmod-ipt-ipopt kmod-ipt-ipset kmod-nf-conncount; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          echo "=== Config check ==="
          grep -E "^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_ROOTFS_OVERLAY|CONFIG_DEFAULT_ipq-wifi|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_docker|CONFIG_PACKAGE_mwan3" .config | head -20

        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build
        run: make -j$(nproc) world
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
            bin/targets/qualcommax/ipq60xx/*initramfs*.itb
            bin/targets/qualcommax/ipq60xx/sha256sums
          retention-days: 3
