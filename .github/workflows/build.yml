name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target"
        required: true
        default: "qualcommax/ipq60xx"
      device:
        description: "Device"
        required: true
        default: "jdcloud_re-cs-02"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build.yml"
      - "configs/config_jdcloud_re-cs-02.config"
      - "configs/extra_packages.config"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            git libncurses-dev libssl-dev python3 subversion unzip wget gettext zstd \
            libelf-dev libtool rsync bc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate build tag
        run: |
          KERNEL_MINOR=$(grep -oP 'LINUX_VERSION-6\.12 = \.\K[0-9]+' target/linux/generic/kernel-6.12)
          BUILD_TS=$(TZ=Asia/Shanghai date +%Y%m%d_%H%M%S)
          echo "BUILD_TAG=6.12.${KERNEL_MINOR}_${BUILD_TS}" >> $GITHUB_ENV
          echo "Build tag: 6.12.${KERNEL_MINOR}_${BUILD_TS}"

      - name: Bootstrap feeds (BEFORE config so Kconfig sees luci packages)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download base .config and extra packages
        run: |
          curl -fL -o .config \
            https://raw.githubusercontent.com/thluozw/immortalwrt/master/configs/config_jdcloud_re-cs-02.config
          curl -fL -o extra_packages.config \
            https://raw.githubusercontent.com/thluozw/immortalwrt/master/configs/extra_packages.config
      - name: Create clean fstab (disable mmcblk0p22 overlay, use loop0+f2fs)
        run: |
          mkdir -p files/etc/config
          cp configs/fstab_clean files/etc/config/fstab
          echo "=== Clean fstab for ROM ==="
          cat files/etc/config/fstab

      - name: Strip "is not set" lines for packages we want to enable
        run: |
          # For each CONFIG_PACKAGE_xxx=y in extra_packages.config,
          # remove the matching "# CONFIG_PACKAGE_xxx is not set" line in base .config
          # so Kconfig doesn't keep them disabled.
          while IFS= read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y)
                key="${line%=y}"
                sed -i "\\|^# ${key} is not set\$|d" .config
                ;;
            esac
          done < extra_packages.config

          # Append extras
          echo "" >> .config
          cat extra_packages.config >> .config

          echo "=== Verify a few keys are enabled in merged .config ==="
          for k in CONFIG_PACKAGE_luci CONFIG_PACKAGE_luci-base \
                   CONFIG_PACKAGE_uhttpd CONFIG_PACKAGE_rpcd \
                   CONFIG_PACKAGE_mwan3 CONFIG_PACKAGE_dockerd \
                   CONFIG_PACKAGE_lua CONFIG_PACKAGE_kmod-veth; do
            grep -E "^${k}=" .config && echo "  -> OK" || echo "  -> $k MISSING"
          done

      - name: Resolve dependencies (defconfig)
        run: |
          make defconfig
          echo "=== Sanity check after defconfig ==="
          ok=0; fail=0
          for k in CONFIG_PACKAGE_luci CONFIG_PACKAGE_luci-base \
                   CONFIG_PACKAGE_luci-mod-network CONFIG_PACKAGE_luci-mod-status \
                   CONFIG_PACKAGE_luci-app-firewall CONFIG_PACKAGE_luci-theme-bootstrap \
                   CONFIG_PACKAGE_uhttpd CONFIG_PACKAGE_uhttpd-mod-ubus CONFIG_PACKAGE_rpcd \
                   CONFIG_PACKAGE_rpcd-mod-luci CONFIG_PACKAGE_liblucihttp \
                   CONFIG_PACKAGE_lua CONFIG_PACKAGE_libuci-lua \
                   CONFIG_PACKAGE_mwan3 CONFIG_PACKAGE_luci-app-mwan3 \
                   CONFIG_PACKAGE_dockerd CONFIG_PACKAGE_luci-app-dockerman \
                   CONFIG_PACKAGE_kmod-veth CONFIG_PACKAGE_kmod-fs-btrfs \
                   CONFIG_PACKAGE_kmod-nf-ipvs CONFIG_PACKAGE_iptables-nft \
                   CONFIG_PACKAGE_luci-i18n-base-zh-cn CONFIG_PACKAGE_luci-i18n-firewall-zh-cn \
                   CONFIG_PACKAGE_luci-app-athena-led CONFIG_PACKAGE_htop; do
            if grep -qE "^${k}=y" .config; then
              echo "  ✓ $k"
              ok=$((ok+1))
            else
              echo "  ✗ $k MISSING"
              fail=$((fail+1))
            fi
          done
          echo "=== Result: ok=$ok fail=$fail ==="
          if [ $fail -gt 0 ]; then
            echo "FATAL: critical packages are missing — aborting build (fix extra_packages.config or base config)"
            exit 1
          fi

      - name: Download sources
        run: make -j$(nproc) download V=s 2>&1 | tail -30 || true

      - name: Build
        run: make -j$(nproc) world
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: List built artifacts
        if: always()
        run: |
          echo "=== Targets ==="
          ls -lh bin/targets/qualcommax/ipq60xx/ 2>/dev/null || echo "no targets"
          echo "=== Package count ==="
          find bin/packages -name "*.apk" 2>/dev/null | wc -l || echo 0
          echo "=== luci/docker/mwan3 .apk built? ==="
          find bin -name "*.apk" 2>/dev/null | grep -E "luci|docker|mwan3|uhttpd" | head -30 || echo "none"

      - name: Prepare APK repo structure
        if: success()
        run: |
          REPO_BASE="deploy/jdcloud_re-cs-02/${{ env.BUILD_TAG }}"

          # Base packages (non-kmod) — copy full tree with APKINDEX
          mkdir -p "${REPO_BASE}/packages"
          cp -r bin/packages/aarch64_cortex-a53 "${REPO_BASE}/packages/"

          # Kmod packages (target-specific)
          mkdir -p "${REPO_BASE}/kmods"
          cp -r bin/targets/qualcommax/ipq60xx/packages/* "${REPO_BASE}/kmods/"

          # Write LATEST tag for easy lookup
          echo "${{ env.BUILD_TAG }}" > deploy/LATEST

          echo "=== APK repo summary ==="
          echo "Total .apk: $(find deploy -name '*.apk' | wc -l)"
          echo "packages.adb files: $(find deploy -name 'packages.adb' | wc -l)"
          echo "Key .apk sample:"
          find deploy -name '*.apk' | grep -iE "luci-base|dockerd|mwan3" | head -10

      - name: Deploy APK repo to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          commit_message: "deploy: ${{ env.BUILD_TAG }}"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BUILD_TAG }}
          path: |
            bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
            bin/targets/qualcommax/ipq60xx/*initramfs*.itb
            bin/targets/qualcommax/ipq60xx/sha256sums
          retention-days: 7
          if-no-files-found: warn

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.BUILD_TAG }}
          path: |
            bin/packages/aarch64_cortex-a53/
            bin/targets/qualcommax/ipq60xx/packages/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.BUILD_TAG }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

