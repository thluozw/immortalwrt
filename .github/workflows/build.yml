name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target"
        required: true
        default: "qualcommax/ipq60xx"
      device:
        description: "Device"
        required: true
        default: "jdcloud_re-cs-02"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build.yml"
      - "files/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            git libncurses-dev libssl-dev python3 subversion unzip wget gettext zstd \
            libelf-dev libtool rsync bc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          TARGET="${{ github.event.inputs.target || 'qualcommax/ipq60xx' }}"
          DEVICE="${{ github.event.inputs.device || 'jdcloud_re-cs-02' }}"
          BOARD=$(echo "$TARGET" | cut -d/ -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d/ -f2)

          make defconfig BOARD="$BOARD" SUBTARGET="$SUBTARGET"

          # Disable ALL other target platforms so only qualcommax/ipq60xx is built
          ./scripts/config/disable TARGET_bcm53xx
          ./scripts/config/disable TARGET_bcm4908
          ./scripts/config/disable TARGET_gemini
          ./scripts/config/disable TARGET_hi3516av
          ./scripts/config/disable TARGET_hi3519av
          ./scripts/config/disable TARGET_imx
          ./scripts/config/disable TARGET_mediatek
          ./scripts/config/disable TARGET_mvebu
          ./scripts/config/disable TARGET_octeon
          ./scripts/config/disable TARGET_oxnas
          ./scripts/config/disable TARGET_qemu
          ./scripts/config/disable TARGET_ramips
          ./scripts/config/disable TARGET_realtek
          ./scripts/config/disable TARGET-rockchip
          ./scripts/config/disable TARGET_rockchip
          ./scripts/config/disable TARGET_sunxi
          ./scripts/config/disable TARGET_x86

          # Set the correct device and enable overlay
          ./scripts/config/enable CONFIG_TARGET_${BOARD}_${DEVICE}
          echo "CONFIG_TARGET_ROOTFS_OVERLAY=y" >> .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_${DEVICE}\"" >> .config

          cat .config | grep -E "^CONFIG_TARGET_|^CONFIG_TARGET_PROFILE|CONFIG_TARGET_ROOTFS"

        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build
        run: make -j$(nproc) world
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
            bin/targets/qualcommax/ipq60xx/*initramfs*.itb
            bin/targets/qualcommax/ipq60xx/sha256sums
          retention-days: 3
