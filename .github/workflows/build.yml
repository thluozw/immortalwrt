name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target"
        required: true
        default: "qualcommax/ipq60xx"
      device:
        description: "Device"
        required: true
        default: "jdcloud_re-cs-02"
  push:
    branches: [master]
    paths: [".github/workflows/build.yml", "files/**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gcc-multilib gawk \
            git libncurses-dev libssl-dev python3 subversion unzip wget libelf-dev zstd \
            ccache gettext rsync

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          TARGET="${{ inputs.target || 'qualcommax/ipq60xx' }}"
          DEVICE="${{ inputs.device || 'jdcloud_re-cs-02' }}"
          BOARD=$(echo "$TARGET" | cut -d/ -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d/ -f2)

          make defconfig BOARD="$BOARD" SUBTARGET="$SUBTARGET"

          echo "CONFIG_TARGET_${BOARD^^}_${SUBTARGET^^}_DEVICE_${DEVICE//-/_}=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_OVERLAY=y" >> .config

          grep -E "qualcommax|jdc|ROOTFS" .config

      - name: Build
        run: make -j$(nproc) world
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
            bin/targets/qualcommax/ipq60xx/*initramfs*.itb
            bin/targets/qualcommax/ipq60xx/*md5sum
          retention-days: 3